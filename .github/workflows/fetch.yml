name: fetch-otc
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [master]
    paths:
      - '.github/workflows/fetch.yml'
      - 'fetch.py'
      - 'po_client/**'
      - 'requirements.txt'
  workflow_dispatch:

concurrency:
  group: fetch-otc
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: install deps
        run: pip install -r requirements.txt |& tee -a run.log
      - name: fetch snapshots
        env:
          PO_SSID: ${{ secrets.PO_SSID }}
        run: |
          set +e
          python fetch.py |& tee -a run.log
          EC=$?
          echo "python_exit=$EC" >> run.log
          echo "finished_at=$(date -u +%FT%TZ)" >> run.log
          exit 0
      - name: commit log and data (always)
        if: always()
        run: |
          set +e
          mkdir -p data
          echo "committed_at=$(date -u +%FT%TZ)" >> run.log
          # keep full log for now — need first-N lines to diagnose region/subscribe
          tail -c 200000 run.log > run.log.trimmed && mv run.log.trimmed run.log
          git config user.email "runner@ci"
          git config user.name "relay-runner"
          git add -f run.log data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "run $(date -u +%FT%TZ)"
          # push may race with parallel runs; retry once after rebase
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase --autostash
          done
          exit 1
